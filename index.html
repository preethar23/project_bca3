<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .carousel-image {
      height: 500px;
    }
  </style>
</head>

<body>

  <!-- navbar -->

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">
        ShopEase
      </a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="#">
              Products
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">
              Services
            </a>
          </li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
              Categories
            </a>
            <ul class="dropdown-menu">
              <li>
                <a class="dropdown-item">
                  Mobiles
                </a>
              </li>
              <li>
                <a class="dropdown-item">
                  Laptops
                </a>
              </li>
              <li>
                <a class="dropdown-item">
                  Fashion
                </a>
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>



  <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel" data-bs-interval="1000">
    <div class="carousel-inner">
      <div class="carousel-item ">
        <img src="./photos/hii.jpg" class="d-block w-100 carousel-image" alt="...">
      </div>
      <div class="carousel-item">
        <img src="./photos/image.jpeg" class="d-block w-100 carousel-image" alt="...">
      </div>
      <div class="carousel-item active">
        <img src="./photos/Times New Roman.png" class="d-block w-100 carousel-image" alt="...">
      </div>

    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
